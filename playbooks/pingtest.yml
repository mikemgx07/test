---

- name: Ping test
  hosts: ios
  connection: network_cli
  become: false
  gather_facts: false

  vars:
    ansible_network_os: cisco.ios.ios
    ansible_become_method: enable

  tasks:
 
    - name: Ping
      cisco.ios.ios_ping:
        dest: 10.11.10.3
      register: output

    - name: Print output
      ansible.builtin.debug:
        var: output.rtt
        var1: output.packet_loss
